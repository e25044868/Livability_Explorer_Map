services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: livability-map-postgis
    environment:
      POSTGRES_DB: livability_map
      POSTGRES_USER: livability
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - livability_map_postgis_data:/var/lib/postgresql/data
      - ./backend/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livability -d livability_map"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  livability_map_postgis_data:

